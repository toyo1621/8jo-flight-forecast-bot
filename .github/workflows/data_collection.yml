name: Daily Flight & Weather Data Collection

on:
  schedule:
    # 毎日日本時間 21:00 (UTC 12:00) に自動実行
    # 最終便の運航ステータス確定後にデータを回収します
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: 未取得・未対応ステータス行の件数確認だけを実行する（既定はdry-run）
        required: false
        default: false
        type: boolean
      cleanup_apply:
        description: 削除を適用する（cleanup_reasonと対象範囲を確認してから使用）
        required: false
        default: false
        type: boolean
      cleanup_date:
        description: 削除対象日をYYYY-MM-DDで限定する（空欄は未解決行全体）
        required: false
        default: ""
        type: string
      cleanup_reason:
        description: 削除を適用する理由
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: daily-flight-weather-data-collection
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # 2. Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip' # pipのキャッシュを有効化して高速化
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      # 3. 依存ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 5. データ収集スクリプトの実行
      # GitHub Secrets に登録した ODPT_API_KEY を環境変数に渡します
      - name: Run data collector
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.cleanup_only != true }}
        env:
          ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
          GCP_PROJECT_ID: hachijo-flight-forecast
          BIGQUERY_DATASET: flight_forecast
          BIGQUERY_TABLE: flight_weather_logs
          BIGQUERY_LOCATION: asia-northeast1
        run: |
          python data_collector.py

      - name: Inspect or clean unresolved BigQuery rows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_only == true }}
        env:
          GCP_PROJECT_ID: hachijo-flight-forecast
          BIGQUERY_DATASET: flight_forecast
          BIGQUERY_TABLE: flight_weather_logs
          BIGQUERY_LOCATION: asia-northeast1
          CLEANUP_APPLY: ${{ inputs.cleanup_apply }}
          CLEANUP_DATE: ${{ inputs.cleanup_date }}
          CLEANUP_REASON: ${{ inputs.cleanup_reason }}
        run: |
          args=(--cleanup-only)
          if [ "$CLEANUP_APPLY" = "true" ]; then args+=(--cleanup-apply); fi
          if [ -n "$CLEANUP_DATE" ]; then args+=(--cleanup-date "$CLEANUP_DATE"); fi
          if [ -n "$CLEANUP_REASON" ]; then args+=(--cleanup-reason "$CLEANUP_REASON"); fi
          python data_collector.py "${args[@]}"

      - name: Check BigQuery data quality
        if: always()
        env:
          GCP_PROJECT_ID: hachijo-flight-forecast
          BIGQUERY_DATASET: flight_forecast
          BIGQUERY_TABLE: flight_weather_logs
          BIGQUERY_LOCATION: asia-northeast1
        run: python data_quality.py --format markdown --output data_quality_report.md --fail-on error

      - name: Add data quality report to summary
        if: always()
        run: |
          if [ -f data_quality_report.md ]; then
            cat data_quality_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Data quality report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check collection coverage
        id: collection_coverage
        if: always()
        env:
          GCP_PROJECT_ID: hachijo-flight-forecast
          BIGQUERY_DATASET: flight_forecast
          BIGQUERY_TABLE: flight_weather_logs
          BIGQUERY_LOCATION: asia-northeast1
        run: python collection_monitor.py --days 14 --output collection_coverage_report.md --fail-on-missing

      - name: Add collection coverage report to summary
        if: always()
        run: |
          if [ -f collection_coverage_report.md ]; then
            cat collection_coverage_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Collection coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify collection coverage gap
        if: ${{ always() && steps.collection_coverage.outcome == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --search 'Daily collection coverage gap in:title' --json number --jq '.[0].number')"
          if [ -f collection_coverage_report.md ]; then
            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --body-file collection_coverage_report.md
            else
              gh issue create --title "Daily collection coverage gap" --body-file collection_coverage_report.md
            fi
          elif [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "Collection coverage report was not generated in run $GITHUB_RUN_ID."
          else
            gh issue create --title "Daily collection coverage gap" --body "Collection coverage report was not generated in run $GITHUB_RUN_ID."
          fi

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collection-data-quality-report
          path: data_quality_report.md
          if-no-files-found: ignore

      - name: Upload collection coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: collection-coverage-report
          path: collection_coverage_report.md
          if-no-files-found: ignore

