name: Retry publication confirmation

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Artifact ID from the failed Pages run
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publication-confirmation-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install publication dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Confirm the existing live artifact and publish snapshots
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GCP_PROJECT_ID: hachijo-flight-forecast
          BIGQUERY_DATASET: flight_forecast
          BIGQUERY_TABLE: flight_weather_logs
          BIGQUERY_LOCATION: asia-northeast1
        run: >-
          python -m flight_forecast.publish_prediction_snapshots
          --artifact-id "$ARTIFACT_ID"
          --public-url "https://toyo1621.github.io/8jo-flight-forecast-bot/"
